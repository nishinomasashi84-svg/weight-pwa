<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Weight Log" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>Weight Log</title>
  <style>
    :root{
      --bg:#f6f7fb; --card:#fff; --text:#111827; --muted:#6b7280;
      --line:#e5e7eb; --accent:#111827; --good:#0f766e; --bad:#b91c1c;
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .wrap{max-width:720px;margin:auto;padding:18px}
    .head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}
    h1{font-size:28px;margin:0}
    .sub{color:var(--muted);font-size:13px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 8px 30px rgba(17,24,39,.05)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat{padding:14px;border-radius:16px;background:#f9fafb}
    .label{font-size:12px;color:var(--muted)}
    .value{font-size:24px;font-weight:800;margin-top:4px}
    .goal{background:#ecfdf5}
    .row{display:flex;gap:10px;align-items:end}
    .field{flex:1}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
    input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:18px}
    button{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px}
    .primary{background:var(--accent);color:white}
    .ghost{background:#eef0f4;color:#111827}
    .danger{background:#fee2e2;color:#991b1b}
    canvas{width:100%;height:220px}
    .history{display:flex;flex-direction:column;gap:8px}
    .item{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
    .item:last-child{border-bottom:0}
    .item b{font-size:17px}
    .delta{font-size:12px}
    .up{color:var(--bad)} .down{color:var(--good)}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .empty{color:var(--muted);text-align:center;padding:22px 0}
    @media(max-width:520px){
      .grid{grid-template-columns:1fr 1fr}
      .row{flex-direction:column;align-items:stretch}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Weight Log</h1>
      <div class="sub">端末内に保存・オフライン対応</div>
    </div>
    <div>⚖️</div>
  </div>

  <section class="card">
    <div class="grid">
      <div class="stat">
        <div class="label">最新</div>
        <div class="value" id="latest">--</div>
      </div>
      <div class="stat goal">
        <div class="label">目標</div>
        <div class="value">68.0 kg</div>
      </div>
      <div class="stat goal">
        <div class="label">目標まで</div>
        <div class="value" id="toGoal">--</div>
      </div>
      <div class="stat">
        <div class="label">前回比</div>
        <div class="value" id="diff">--</div>
      </div>
      <div class="stat">
        <div class="label">開始比</div>
        <div class="value" id="fromStart">--</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <div class="field">
        <label>日付</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label>体重（kg）</label>
        <input type="number" id="weight" inputmode="decimal" step="0.1" min="20" max="300" placeholder="例 72.4">
      </div>
      <button class="primary" id="saveBtn">記録する</button>
    </div>
  </section>

  <section class="card">
    <div class="label" style="margin-bottom:8px">体重推移</div>
    <canvas id="chart" width="680" height="220"></canvas>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div>
        <div style="font-weight:800">履歴</div>
        <div class="sub">日付をタップして編集できます</div>
      </div>
      <div class="actions">
        <button class="ghost" id="exportBtn">CSV出力</button>
        <label class="ghost" style="padding:14px 16px;border-radius:14px;font-weight:700;cursor:pointer;margin:0">
          CSV読込
          <input id="importFile" type="file" accept=".csv,text/csv" hidden>
        </label>
      </div>
    </div>
    <div id="history" class="history"></div>
  </section>

  <section class="card">
    <div class="sub">※ データはこのiPhone / ブラウザ内に保存されます。Safariのサイトデータ削除や端末初期化で消える可能性があります。大事ならCSVを定期バックアップしてください。</div>
  </section>
</div>

<script>
const KEY='weight-log-v1';
const GOAL_WEIGHT=68.0;
const $=s=>document.querySelector(s);
const dateEl=$('#date'), weightEl=$('#weight');
dateEl.value = new Date().toISOString().slice(0,10);

function load(){
  try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}
}
function save(data){localStorage.setItem(KEY,JSON.stringify(data))}
function sortData(data){return [...data].sort((a,b)=>a.date.localeCompare(b.date))}
function fmt(v){return Number(v).toFixed(1)+' kg'}

function render(){
  const data=sortData(load());
  const latest=data.at(-1), prev=data.at(-2), first=data[0];
  $('#latest').textContent=latest?fmt(latest.weight):'--';
  if(latest){
    const remaining=latest.weight-GOAL_WEIGHT;
    $('#toGoal').textContent=remaining>0?remaining.toFixed(1)+' kg':remaining===0?'達成！':'達成！';
    $('#toGoal').className='value '+(remaining<=0?'down':'');
  }else{
    $('#toGoal').textContent='--'; $('#toGoal').className='value';
  }
  if(latest&&prev){
    const d=latest.weight-prev.weight;
    $('#diff').textContent=(d>0?'+':'')+d.toFixed(1);
    $('#diff').className='value '+(d>0?'up':d<0?'down':'');
  }else{
    $('#diff').textContent='--'; $('#diff').className='value';
  }
  if(latest&&first){
    const d=latest.weight-first.weight;
    $('#fromStart').textContent=(d>0?'+':'')+d.toFixed(1);
    $('#fromStart').className='value '+(d>0?'up':d<0?'down':'');
  }else{
    $('#fromStart').textContent='--'; $('#fromStart').className='value';
  }

  const hist=$('#history');
  hist.innerHTML='';
  if(!data.length){hist.innerHTML='<div class="empty">まだ記録がありません</div>'}
  [...data].reverse().forEach((r)=>{
    const originalIndex=data.findIndex(x=>x.date===r.date);
    const prevChrono=originalIndex>0?data[originalIndex-1]:null;
    const d=prevChrono?r.weight-prevChrono.weight:null;
    const div=document.createElement('div');
    div.className='item';
    div.innerHTML=`<div><b>${r.date}</b><div class="delta ${d>0?'up':d<0?'down':''}">${d==null?'':((d>0?'+':'')+d.toFixed(1)+' kg')}</div></div>
      <div style="display:flex;gap:8px;align-items:center"><b>${fmt(r.weight)}</b><button class="danger">削除</button></div>`;
    div.querySelector('b').addEventListener('click',()=>{dateEl.value=r.date;weightEl.value=r.weight;window.scrollTo({top:0,behavior:'smooth'})});
    div.querySelector('.danger').addEventListener('click',()=>{
      if(confirm(`${r.date} の記録を削除しますか？`)){
        save(data.filter(x=>x.date!==r.date)); render();
      }
    });
    hist.appendChild(div);
  });
  drawChart(data);
}

$('#saveBtn').addEventListener('click',()=>{
  const date=dateEl.value;
  const weight=parseFloat(weightEl.value);
  if(!date||!Number.isFinite(weight)){alert('日付と体重を入力してください');return}
  let data=load().filter(x=>x.date!==date);
  data.push({date,weight});
  save(sortData(data));
  weightEl.value='';
  render();
});

function drawChart(data){
  const c=$('#chart'), ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const cssW=c.clientWidth||680, cssH=220;
  c.width=cssW*dpr; c.height=cssH*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,cssW,cssH);
  if(data.length<1){
    ctx.fillStyle='#9ca3af';ctx.font='14px sans-serif';ctx.textAlign='center';
    ctx.fillText('記録するとここにグラフが出ます',cssW/2,110);return;
  }
  const vals=data.map(x=>x.weight);
  let min=Math.min(...vals), max=Math.max(...vals);
  if(min===max){min-=1;max+=1}
  const padL=42,padR=12,padT=18,padB=30;
  const W=cssW-padL-padR,H=cssH-padT-padB;
  ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const y=padT+H*i/3;
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(cssW-padR,y);ctx.stroke();
  }
  ctx.fillStyle='#6b7280';ctx.font='11px sans-serif';ctx.textAlign='right';
  for(let i=0;i<4;i++){
    const v=max-(max-min)*i/3;
    const y=padT+H*i/3+4;
    ctx.fillText(v.toFixed(1),padL-6,y);
  }
  const x=i=>data.length===1?padL+W/2:padL+W*i/(data.length-1);
  const y=v=>padT+H*(max-v)/(max-min);
  ctx.strokeStyle='#111827';ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.beginPath();
  data.forEach((r,i)=>{i?ctx.lineTo(x(i),y(r.weight)):ctx.moveTo(x(i),y(r.weight))});
  ctx.stroke();
  ctx.fillStyle='#111827';
  data.forEach((r,i)=>{ctx.beginPath();ctx.arc(x(i),y(r.weight),4,0,Math.PI*2);ctx.fill()});
  ctx.fillStyle='#6b7280';ctx.font='10px sans-serif';ctx.textAlign='center';
  const picks=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  picks.forEach(i=>ctx.fillText(data[i].date.slice(5).replace('-','/'),x(i),cssH-8));
}

$('#exportBtn').addEventListener('click',()=>{
  const data=sortData(load());
  if(!data.length){alert('出力するデータがありません');return}
  const csv='date,weight_kg\n'+data.map(r=>`${r.date},${r.weight}`).join('\n');
  const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='weight-log.csv';a.click();URL.revokeObjectURL(a.href);
});

$('#importFile').addEventListener('change',async e=>{
  const file=e.target.files[0];if(!file)return;
  const text=await file.text();
  const lines=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/).slice(1);
  let incoming=[];
  for(const line of lines){
    const [date,w]=line.split(',');
    const weight=parseFloat(w);
    if(/^\d{4}-\d{2}-\d{2}$/.test(date)&&Number.isFinite(weight)) incoming.push({date,weight});
  }
  const merged=new Map(load().map(x=>[x.date,x]));
  incoming.forEach(x=>merged.set(x.date,x));
  save(sortData([...merged.values()]));render();
  e.target.value='';
});

window.addEventListener('resize',()=>drawChart(sortData(load())));
render();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
</script>
</body>
</html>
